name: Offline quality and release checks

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out reviewed repository contents
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, observed 2026-11-18
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, observed 2026-11-18
        with:
          python-version: "3.12"
      - name: Install code and test dependencies
        run: python -m pip install -c requirements/constraints-base.txt -e '.[dev]'
      - name: Validate controlled data release
        run: python scripts/validate_release.py
      - name: Validate the ABC notebook and app corpus
        run: python scripts/validate_release.py --release documents/abc-six-day
      - name: Lint application and checks
        run: ruff check app scripts tests
      - name: Run offline business tests
        run: pytest -q
      - name: Check browser conversation and source labels
        run: node --test tests/*.test.mjs
