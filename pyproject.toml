[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-trail-rag"
version = "0.1.0"
description = "A local, evidence-grounded Nepal trekking research prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "qdrant-client>=1.13,<2",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyyaml>=6,<7"]
embeddings = ["sentence-transformers>=5,<6"]
mlx = ["mlx-lm>=0.32,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"]
download = ["huggingface-hub>=1,<3", "truststore>=0.10,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "abc_itineraries.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
